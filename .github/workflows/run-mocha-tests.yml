name: Run Mocha Tests

on:
    push:
        branches:
            - main
            - dev
            - tests
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'

            - name: Install dependencies
              run: npm install

            - name: Run Mocha tests
              run: npx mocha test/webserver.test.js